name: refresh

# ORDERING MATTERS. This workflow mirrors the *served* payload
# (https://smmscout.com/api/panels.json), which the source repo
# RelayStack/smmscout republishes from its weekly run
# (.github/workflows/weekly-maintenance.yml, `cron: '0 4 * * 1'`, new data
# ~15 min into the run). GitHub fires scheduled runs hours late on this
# account (source starts observed 2026-10-12T11:29Z and 2026-10-05T11:01Z for
# that 04:00 schedule), so a mirror slot only an hour later always pulled the
# payload the source was about to supersede — on 2026-10-13 this dataset
# carried data_built_at 2026-10-12T01:51:34Z while live was
# 2026-10-12T11:36:05Z, and 59 of 129 published scores differed. The mirror
# therefore has to run *after* the source's Monday refresh, with margin for the
# schedule delay. Keep this slot strictly later than the source's cron.
on:
  schedule:
    # Mondays 20:00 UTC — ~8 h after the latest observed source run, not 1 h before it.
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull and rebuild dataset
        run: |
          set -e
          curl -sf "https://smmscout.com/api/panels.json?r=$(date +%s)" -o /tmp/panels.json
          python3 - <<'PY'
          import json, csv, os
          d = json.load(open('/tmp/panels.json'))
          date = d['generated_at'][:10]
          os.makedirs('data/snapshots', exist_ok=True)
          os.makedirs('data/probes', exist_ok=True)
          json.dump(d, open('data/panels.json', 'w'), indent=1)
          if not os.path.exists(f'data/snapshots/panels-{date}.json'):
              json.dump(d, open(f'data/snapshots/panels-{date}.json', 'w'), indent=1)
          with open('data/panels.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['slug','name','domain','url','platforms','services','response_ms','verified','boost','flags','score'])
              for p in d['panels']:
                  w.writerow([p.get('slug'), p.get('name'), p.get('domain'), p.get('url'),
                              '|'.join(p.get('platforms') or []), p.get('services'),
                              p.get('response_ms'), p.get('verified'), p.get('boost'),
                              ';'.join(x['text'] for x in (p.get('flags') or [])), p.get('score')])
          meta = {'updated': d['generated_at'], 'panels': d['count']}
          json.dump(meta, open('meta.json', 'w'))
          print('rebuilt at', date)
          PY
          curl -sf "https://smmscout.com/api/probe?limit=60&r=$(date +%s)" -o /tmp/probes.json || true
          python3 - <<'PY'
          import json, os
          try:
              p = json.load(open('/tmp/probes.json'))
              date = __import__('datetime').date.today().isoformat()
              json.dump(p.get('results', []), open(f'data/probes/probes-{date}.json', 'w'), indent=1)
          except Exception as e:
              print('probe snapshot skipped:', e)
          PY
      # A mirror run that fires before the source refreshed re-publishes the build it
      # already had: no diff, "no changes", green — the silent staleness that hid the
      # ordering bug for weeks. State which build was mirrored on every run, and flag it
      # when the pull is not newer than the committed copy.
      - name: Report which build was mirrored
        run: |
          python3 - <<'PY'
          import json, subprocess
          live = json.load(open('data/panels.json'))
          built = live.get('data_built_at')
          prev = subprocess.run(['git', 'show', 'HEAD:data/panels.json'],
                                capture_output=True, text=True)
          was = None
          if prev.returncode == 0:
              try:
                  was = json.loads(prev.stdout).get('data_built_at')
              except Exception:
                  was = None
          if was and built and built <= was:
              print('::warning title=Stale mirror pull::mirrored data_built_at %s is not newer than the '
                    'committed %s - the source weekly run may not have landed yet; check this workflow\'s '
                    'schedule against RelayStack/smmscout weekly-maintenance.yml' % (built, was))
          else:
              print('::notice::mirrored data_built_at %s (committed copy was %s)' % (built, was))
          PY
      - name: Validate and derive stats
        run: |
          node scripts/validate.mjs
          node scripts/stats.mjs
      - name: Consistency gate (meta.json, CSV parity, published panel counts)
        # A commit pushed with the job's own GITHUB_TOKEN does NOT trigger
        # verify.yml, so this workflow's refreshes were the one ungated write path:
        # the 2026-10-19 pull grew the dataset 129 -> 193 while README, docs and the
        # repo description still claimed 129, and nothing went red. Run the same gate
        # here, before the commit, so a bot refresh that outgrows the published
        # claims fails loudly instead of shipping rot.
        run: node scripts/verify-consistency.mjs --report
      - name: Commit if changed
        run: |
          git config user.name "smmscout-data-bot"
          git config user.email "contact@smmscout.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: weekly data refresh"
            git push
          fi
